spring.application.name=registrar-recepcion-bolsin
server.port=8080

# ================= SQL Server =================
# Antes de arrancar, crear la base una sola vez en SSMS:   CREATE DATABASE PPAI_Bolsines;
# Autenticación de Windows (integratedSecurity=true): usa el usuario con el que entran a Windows,
# así que no hace falta usuario ni contraseña.
# Si en SSMS el servidor se llama "...\SQLEXPRESS", cambiar "localhost:1433" por "localhost\\SQLEXPRESS".
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=PPAI_Bolsines;integratedSecurity=true;encrypt=true;trustServerCertificate=true
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ================= JPA / Hibernate =================
# create: en cada arranque crea las tablas desde las entidades y data.sql carga los datos de prueba.
# Así la demo siempre arranca igual. Los cambios del CU quedan guardados en la base mientras corre la app.
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Ejecutar data.sql después de crear las tablas
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
